services:
  # ──────────────────────────────────────
  # PostgreSQL
  # ──────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: cliniq_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cliniq}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cliniq_secret}
      POSTGRES_DB: ${POSTGRES_DB:-cliniq_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cliniq"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ──────────────────────────────────────
  # Redis
  # ──────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: cliniq_redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-redis_secret}
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-redis_secret}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ──────────────────────────────────────
  # N8N
  # ──────────────────────────────────────
  n8n:
    image: n8nio/n8n:latest
    container_name: cliniq_n8n
    restart: unless-stopped
    environment:
      - N8N_HOST=${N8N_HOST:-localhost}
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY:-changeme_32chars_key}
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_HOST=postgres
      - DB_POSTGRESDB_PORT=5432
      - DB_POSTGRESDB_DATABASE=n8n_db
      - DB_POSTGRESDB_USER=${POSTGRES_USER:-cliniq}
      - DB_POSTGRESDB_PASSWORD=${POSTGRES_PASSWORD:-cliniq_secret}
      - WEBHOOK_URL=http://localhost:5678/
      - GENERIC_TIMEZONE=America/Sao_Paulo
    volumes:
      - n8n_data:/home/node/.n8n
    ports:
      - "5678:5678"
    depends_on:
      postgres:
        condition: service_healthy

  # ──────────────────────────────────────
  # Evolution API (WhatsApp)
  # ──────────────────────────────────────
  evolution:
    image: atendai/evolution-api:latest
    container_name: cliniq_evolution
    restart: unless-stopped
    environment:
      - SERVER_URL=http://localhost:8080
      - AUTHENTICATION_API_KEY=${EVOLUTION_API_KEY:-cliniq_evolution_key}
      - DATABASE_ENABLED=true
      - DATABASE_CONNECTION_URI=postgresql://${POSTGRES_USER:-cliniq}:${POSTGRES_PASSWORD:-cliniq_secret}@postgres:5432/evolution_db
      - REDIS_ENABLED=true
      - REDIS_URI=redis://:${REDIS_PASSWORD:-redis_secret}@redis:6379
      - WEBHOOK_GLOBAL_ENABLED=false
      - LOG_LEVEL=ERROR
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ──────────────────────────────────────
  # App (Next.js) — dev mode
  # ──────────────────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: cliniq_app
    restart: unless-stopped
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-cliniq}:${POSTGRES_PASSWORD:-cliniq_secret}@postgres:5432/${POSTGRES_DB:-cliniq_db}
      - REDIS_URL=redis://:${REDIS_PASSWORD:-redis_secret}@redis:6379
      - NEXTAUTH_URL=${NEXTAUTH_URL:-http://localhost:3000}
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET:-changeme_nextauth_secret}
      - EVOLUTION_API_URL=http://evolution:8080
      - EVOLUTION_API_KEY=${EVOLUTION_API_KEY:-cliniq_evolution_key}
      - N8N_WEBHOOK_URL=http://n8n:5678
      - OPENAI_API_KEY=${OPENAI_API_KEY}
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
volumes:
  postgres_data:
  redis_data:
  n8n_data:
