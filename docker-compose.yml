services:
  # ──────────────────────────────────────
  # PostgreSQL
  # ──────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: cliniq_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cliniq}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cliniq_secret}
      POSTGRES_DB: ${POSTGRES_DB:-cliniq_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cliniq} -d ${POSTGRES_DB:-cliniq_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ──────────────────────────────────────
  # Redis
  # ──────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: cliniq_redis
    restart: unless-stopped
    # remove o command com requirepass
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis-evolution:
    image: redis:7-alpine
    container_name: cliniq_redis_evolution
    restart: unless-stopped
    ports:
      - "6380:6379"
  # ──────────────────────────────────────
  # N8N
  # ──────────────────────────────────────
  n8n:
    image: n8nio/n8n:latest
    container_name: cliniq_n8n
    restart: unless-stopped
    environment:
      - N8N_HOST=${N8N_HOST:-localhost}
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY:-changeme_32chars_key}
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_HOST=postgres
      - DB_POSTGRESDB_PORT=5432
      - DB_POSTGRESDB_DATABASE=${N8N_POSTGRES_DB:-n8n_db}
      - DB_POSTGRESDB_USER=${POSTGRES_USER:-cliniq}
      - DB_POSTGRESDB_PASSWORD=${POSTGRES_PASSWORD:-cliniq_secret}
      - WEBHOOK_URL=http://localhost:5678/
      - GENERIC_TIMEZONE=America/Sao_Paulo
      - REDIS_ENABLED=true
      - REDIS_URI=redis://redis:6379/0
    volumes:
      - n8n_data:/home/node/.n8n
    ports:
      - "5678:5678"
    depends_on:
      postgres:
        condition: service_healthy

  # ──────────────────────────────────────
  # Evolution API (WhatsApp)
  # ──────────────────────────────────────
  evolution:
    image: atendai/evolution-api:latest
    container_name: cliniq_evolution
    restart: unless-stopped
    environment:
      - SERVER_URL=http://100.80.38.42:8080
      - SERVER_PORT=8080
      - SERVER_TYPE=http
      - CORS_ORIGIN=*
      - CORS_METHODS=GET,POST,PUT,DELETE
      - CORS_CREDENTIALS=true
      - LOG_COLOR=true
      - LOG_BAILEYS=debug
      - LOG_LEVEL=ERROR,WARN,INFO,LOG,DEBUG
      - DATABASE_PROVIDER=postgresql
      - DATABASE_URL=postgresql://cliniq:cliniq_secret@postgres:5432/evolution_db
      - DATABASE_CONNECTION_URI=postgresql://cliniq:cliniq_secret@postgres:5432/evolution_db
      - DATABASE_CONNECTION_CLIENT_NAME=evolution_exchange
      - DATABASE_SAVE_DATA_INSTANCE=true
      - DATABASE_SAVE_DATA_NEW_MESSAGE=true
      - DATABASE_SAVE_MESSAGE_UPDATE=true
      - DATABASE_SAVE_DATA_CONTACTS=true
      - DATABASE_SAVE_DATA_CHATS=true
      - DATABASE_SAVE_DATA_HISTORIC=true
      - AUTHENTICATION_API_KEY=cliniq_evolution_key
      - CACHE_REDIS_ENABLED=true
      - CACHE_REDIS_URI=redis://redis:6379/6
      - CACHE_REDIS_TTL=604800
      - CACHE_REDIS_PREFIX_KEY=evolution
      - CACHE_REDIS_SAVE_INSTANCES=false
      - WEBHOOK_GLOBAL_ENABLED=false
      - RABBITMQ_ENABLED=false
      - WEBSOCKET_ENABLED=false
      - DEL_INSTANCE=false
      - QRCODE_LIMIT=30
      - CONFIG_SESSION_PHONE_VERSION=2.3000.1023368132
    volumes: []
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
  # ──────────────────────────────────────
  # App (Next.js) — dev mode
  # ──────────────────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: cliniq_app
    restart: unless-stopped
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-cliniq}:${POSTGRES_PASSWORD:-cliniq_secret}@postgres:5432/${POSTGRES_DB:-cliniq_db}
      - REDIS_URL=redis://redis:6379
      - NEXTAUTH_URL=${NEXTAUTH_URL:-http://localhost:3000}
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET:-changeme_nextauth_secret}
      - EVOLUTION_API_URL=http://evolution:8080
      - EVOLUTION_API_KEY=${EVOLUTION_API_KEY:-cliniq_evolution_key}
      - N8N_WEBHOOK_URL=http://n8n:5678
      - OPENAI_API_KEY=${OPENAI_API_KEY}
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy


  workers:
    build:
      context: .
      dockerfile: Dockerfile.workers
    container_name: cliniq_workers
    restart: unless-stopped
    environment:
      - DATABASE_URL=postgresql://cliniq:cliniq_secret@postgres:5432/cliniq_db
      - REDIS_URL=redis://redis:6379
      - EVOLUTION_API_URL=http://evolution:8080
      - EVOLUTION_API_KEY=cliniq_evolution_key
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - NEXTAUTH_URL=http://100.80.38.42:3000
      - GEMINI_API_KEY=${GEMINI_API_KEY}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
  n8n_data:
